name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# The workflow only reads the code: the token it gets cannot push, comment or change
# settings, even if a dependency or step is compromised.
permissions:
  contents: read

jobs:
  install-lint-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The design check compares the pull request with its base branch.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Known vulnerabilities in the packages the app ships (not lint and test tools).
      - name: Check for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      # Only lines the pull request adds or changes are checked; see DESIGN.md.
      - name: Check the design system
        if: github.event_name == 'pull_request'
        run: |
          npm run design:test
          node scripts/check-design.mjs --base "$(git merge-base origin/${{ github.base_ref }} HEAD)"

      - name: Lint the code
        run: npm run lint

      # - name: Analyze unused files and dependencies
      #   run: npm run knip

      - name: Run Prettier check
        # The existing repository has many pre-existing formatting differences.
        # Keep the check visible without blocking type/build tests; clean up formatting separately.
        run: npm run format:check || echo "::warning::Prettier found existing repository formatting issues; build and test checks will continue."

      - name: Build the project
        run: npm run build

      - name: Install browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test
