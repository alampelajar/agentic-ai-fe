# Security headers, included in every location: nginx drops server-level add_header
# lines in any location that has its own, so they live here and are included each time.

# What the page may load. Scripts come only from this site and Google Sign-In, so a
# script injected into the page does not run. Connections go to this site, the API
# (__API_ORIGIN__ is replaced with the API origin when the image is built), Google
# Sign-In and the Local Agent Runner on the user's own computer. Images may come from
# any https host (provider logos, avatars). Styles allow inline style attributes,
# which the UI components set.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' __API_ORIGIN__ https://accounts.google.com/gsi/ http://127.0.0.1:8765 http://localhost:8765; frame-src https://accounts.google.com/gsi/; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Only has an effect over HTTPS; browsers ignore it on plain HTTP.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
