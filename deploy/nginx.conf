server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers (CSP, HSTS and the rest) are in security-headers.conf and are
    # included in each location, because a location with its own add_header would
    # otherwise drop the ones set here.
    include /etc/nginx/snippets/security-headers.conf;

    # Built files have content hashes in their names: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app is a single page: any other path is handled by the router, and
    # index.html itself must never be cached or a release would not reach users.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
